site_name: Piova
site_url: https://piova.baluyotraf.com
site_description: Stories and Codes from Research to Production
repo_url: https://github.com/baluyotraf/piova
repo_name: baluyotraf/softwareplusml
edit_uri: ""
copyright: Copyright &copy; 2024 Raffaello Baluyot

nav:
  - Home: index.md
  - Blogs:
      - stories/index.md
  - Projects:
      - Alternative Queries: projects/altqq.md
  - Lecture Notes: "!include ./lectures/mkdocs.yml"

plugins:
  - include-markdown
  - monorepo
  - search
  - blog:
      blog_dir: stories

markdown_extensions:
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: true

theme:
  name: material
  language: en
  palette:
    primary: black
    accent: light blue
  icon:
    logo: fontawesome/solid/cloud-showers-heavy
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/baluyotraf/
      name: baluyotraf
    - icon: fontawesome/brands/github
      link: https://github.com/baluyotraf
      name: baluyotraf
